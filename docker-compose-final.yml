# FINAL SUBMISSION docker-compose.yml
# Replace YOUR_DOCKERHUB_USERNAME with your actual Docker Hub username
# after running: ./build_push.sh YOUR_USERNAME

services:
  model:
    image: YOUR_DOCKERHUB_USERNAME/vllm-qwen3-5-2b-optimized:v1.0
    entrypoint:
      - /entrypoint.sh
    command:
      - --model=/model
      - --served-model-name=Qwen3.5-2B
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=262144
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --dtype=bfloat16
      - --enable-prefix-caching
      - --kv-cache-dtype=fp8
      - --enable-chunked-prefill
      - --max-num-seqs=256
      - --max-num-batched-tokens=8192
      - --spec-method=mtp
      - --spec-tokens=3
      - --performance-mode=throughput
      - --no-enable-log-requests
    ports:
      - "8000:8000"
    shm_size: "4g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
